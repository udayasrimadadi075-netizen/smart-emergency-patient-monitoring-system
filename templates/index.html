<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Emergency Patient Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🚑 Smart Emergency Patient Monitor</h1>

    <p style="text-align:center;">
        Real-time patient vital signs monitoring
    </p>

    <div class="vitals">

        <div class="card">
            <h2>❤️ Heart Rate</h2>
            <div class="value" id="heartRate">78 BPM</div>
        </div>

        <div class="card">
            <h2>🫁 SpO₂</h2>
            <div class="value" id="spo2">98%</div>
        </div>

        <div class="card">
            <h2>🌡️ Temperature</h2>
            <div class="value" id="temperature">36.7 °C</div>
        </div>

        <div class="card">
            <h2>💨 Respiratory Rate</h2>
            <div class="value" id="respiratory">16 /min</div>
        </div>

    </div>

    <div class="alert" id="alert">
        ✅ Patient status: Stable
    </div>

</div>

</body>
</html>
